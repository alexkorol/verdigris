<meta charset="utf-8">
<!-- Verdigris — Founding of a House. Front-end vertical slice.
     Design laboratory only: fakes all backend behavior locally.
     Built from supplied magenta-keyed plates; everything else procedural. -->
<title>Founding of a House</title>
<style>
  :root{
    --bg:#14110d; --panel:#1e1913; --panel2:#262019; --ink:#d8cdb8; --dim:#8d8471;
    --bronze:#b08d57; --bronze2:#8a6a3b; --verd:#5aa88a; --verd2:#3d7a63;
    --blood:#a5493c; --gold:#d9b25f; --relic:#c98be0; --line:#3a3128;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  .serif{font-family:Georgia,"Times New Roman",serif}
  /* ---------- HUD ---------- */
  #hud{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;display:flex;align-items:flex-end;gap:14px;pointer-events:none;user-select:none}
  .bars{width:300px}
  .bar{height:14px;border:1px solid var(--bronze2);background:#0d0b08;border-radius:2px;overflow:hidden;margin-bottom:5px;position:relative}
  .bar>i{display:block;height:100%;transition:width .12s ease-out}
  .bar.life>i{background:linear-gradient(#8f4437,#6d2f26)}
  .bar.breath>i{background:linear-gradient(#4d7f96,#35586a)}
  .bar>b{position:absolute;inset:0;text-align:center;font-size:10px;line-height:14px;color:#e8dfca;font-weight:400;text-shadow:0 1px 2px #000}
  .xp{height:4px;background:#0d0b08;border:1px solid var(--line);border-radius:2px}
  .xp>i{display:block;height:100%;background:var(--verd2)}
  #wpncard{min-width:170px;background:rgba(30,25,19,.88);border:1px solid var(--bronze2);border-radius:3px;padding:7px 10px;font-size:12px}
  #wpncard .nm{color:var(--gold);font-weight:600}
  #wpncard .ability{color:var(--dim);margin-top:2px}
  #locband{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
  #locname{font-family:Georgia,serif;font-size:19px;letter-spacing:.12em;color:var(--ink);text-shadow:0 2px 6px #000}
  #locsub{font-size:11px;color:var(--dim);letter-spacing:.2em;text-transform:uppercase}
  #housechip{position:absolute;top:10px;left:12px;background:rgba(30,25,19,.85);border:1px solid var(--line);border-left:3px solid var(--verd2);border-radius:2px;padding:6px 12px;font-size:12px;pointer-events:none}
  #housechip .h{color:var(--verd);font-family:Georgia,serif;letter-spacing:.06em}
  #keysref{position:absolute;top:10px;right:12px;text-align:right;font-size:11px;color:var(--dim);pointer-events:none;text-shadow:0 1px 2px #000}
  #toasts{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
  .toast{background:rgba(20,17,13,.92);border:1px solid var(--line);padding:5px 14px;border-radius:2px;font-size:13px;animation:toastin .25s ease-out;white-space:nowrap}
  .toast.gold{border-color:var(--bronze);color:var(--gold)}
  .toast.relic{border-color:var(--relic);color:var(--relic)}
  .toast.house{border-color:var(--verd2);color:var(--verd)}
  @keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  #prompt{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);pointer-events:none;font-size:13px;color:var(--gold);background:rgba(20,17,13,.85);border:1px solid var(--bronze2);padding:4px 12px;border-radius:2px;display:none}
  /* ---------- Panels ---------- */
  .panel{position:absolute;background:var(--panel);border:1px solid var(--bronze2);border-radius:3px;box-shadow:0 10px 40px rgba(0,0,0,.6);display:none}
  .panel h2{font-family:Georgia,serif;font-weight:400;letter-spacing:.1em;font-size:16px;color:var(--gold);padding:10px 16px;border-bottom:1px solid var(--line)}
  .panel .bd{padding:12px 16px}
  #inv{right:14px;top:60px;width:330px;max-height:calc(100% - 200px);overflow-y:auto}
  .slotrow{display:flex;gap:6px;margin-bottom:10px}
  .islot{flex:1;border:1px solid var(--line);background:var(--panel2);border-radius:2px;padding:6px 8px;font-size:11px;min-height:52px}
  .islot .lbl{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.1em}
  .item{border:1px solid var(--line);background:var(--panel2);border-radius:2px;padding:6px 8px;font-size:12px;margin-bottom:6px;cursor:pointer;position:relative}
  .item:hover{border-color:var(--bronze)}
  .item .nm{font-weight:600}
  .item .st{color:var(--dim);font-size:11px}
  .item .hist{color:#7d7364;font-size:10px;font-style:italic;margin-top:2px}
  .q0 .nm{color:#cfc6b2}.q1 .nm{color:#7fb583}.q2 .nm{color:#6fa7c7}.q3 .nm{color:var(--gold)}.q4 .nm{color:var(--relic)}
  .statline{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
  .statline b{color:var(--ink);font-weight:600}
  button{background:var(--panel2);border:1px solid var(--bronze2);color:var(--ink);font:12px "Segoe UI",sans-serif;padding:5px 12px;border-radius:2px;cursor:pointer}
  button:hover{border-color:var(--bronze);color:var(--gold)}
  button.big{font-size:14px;padding:9px 22px}
  button.verd{border-color:var(--verd2)}
  button.verd:hover{color:var(--verd)}
  /* ---------- Map / overlay screens ---------- */
  #overlay{position:absolute;inset:0;background:rgba(10,8,6,.82);display:none;align-items:center;justify-content:center;z-index:20}
  #overlay .card{width:min(860px,94vw);max-height:92vh;overflow-y:auto;background:var(--panel);border:1px solid var(--bronze2);border-radius:4px;padding:26px 32px}
  #overlay h1{font-family:Georgia,serif;font-weight:400;font-size:26px;letter-spacing:.1em;color:var(--gold);margin-bottom:4px}
  #overlay h3{font-family:Georgia,serif;font-weight:400;font-size:15px;color:var(--verd);margin:14px 0 6px}
  #overlay p{color:var(--ink);margin:8px 0;max-width:70ch}
  #overlay .dim{color:var(--dim);font-size:12px}
  .choices{display:flex;gap:12px;margin-top:16px}
  .choice{flex:1;border:1px solid var(--line);background:var(--panel2);border-radius:3px;padding:14px;cursor:pointer}
  .choice:hover{border-color:var(--bronze)}
  .choice h4{font-family:Georgia,serif;font-weight:400;color:var(--gold);margin-bottom:6px}
  .choice .sub{color:var(--verd);font-size:11px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}
  .choice p{font-size:12px;color:var(--dim)}
  #mapcanvas{width:100%;height:380px;background:#171310;border:1px solid var(--line);border-radius:3px;cursor:pointer}
  .hrow{display:flex;gap:20px;margin-top:12px}
  .hcol{flex:1;border:1px solid var(--line);border-radius:3px;padding:10px 12px;background:var(--panel2)}
  .hcol h5{color:var(--verd);font-size:11px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}
  .hcol .v{font-family:Georgia,serif;font-size:20px;color:var(--ink)}
  .hcol ul{list-style:none;font-size:11px;color:var(--dim)}
  .hcol li{padding:1px 0}
  input[type=text]{background:#0d0b08;border:1px solid var(--bronze2);color:var(--gold);font:16px Georgia,serif;padding:8px 12px;border-radius:2px;width:280px;letter-spacing:.06em}
  input[type=range]{width:130px}
  /* ---------- Debug ---------- */
  #debug{left:12px;top:60px;width:290px;font-size:11px;max-height:calc(100% - 160px);overflow-y:auto}
  #debug .bd{display:flex;flex-wrap:wrap;gap:5px}
  #debug button{font-size:11px;padding:3px 8px}
  #debug .cam{width:100%;border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
  #debug .cam label{display:flex;justify-content:space-between;align-items:center;color:var(--dim);margin:3px 0}
  #debug .cam span{width:44px;text-align:right;color:var(--ink)}
  .lvlup{display:flex;gap:10px;margin-top:10px}
  #vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(8,6,4,.55) 100%)}
</style>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="vign"></div>
  <div id="locband"><div id="locname"></div><div id="locsub"></div></div>
  <div id="housechip"></div>
  <div id="keysref">WASD move · mouse aim · LMB strike · RMB skill · Space dodge<br>E interact · I gear · M map · ` debug</div>
  <div id="prompt"></div>
  <div id="toasts"></div>
  <div id="hud">
    <div class="bars">
      <div class="bar life"><i id="lifebar"></i><b id="lifetxt"></b></div>
      <div class="bar breath"><i id="breathbar"></i><b id="breathtxt"></b></div>
      <div class="xp"><i id="xpbar"></i></div>
    </div>
    <div id="wpncard"></div>
  </div>
  <div class="panel" id="inv"><h2>Bearing &amp; Gear</h2><div class="bd" id="invbd"></div></div>
  <div class="panel" id="debug"><h2>Laboratory</h2><div class="bd" id="debugbd"></div></div>
  <div id="overlay"><div class="card" id="ovcard"></div></div>
</div>
<script>
'use strict';
/* ============================== utils ============================== */
const TAU=Math.PI*2, RAD=Math.PI/180;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(bx-ax,by-ay);
const angTo=(ax,ay,bx,by)=>Math.atan2(by-ay,bx-ax);
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d};
function mulberry32(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(rng,arr)=>arr[Math.floor(rng()*arr.length)];
const el=id=>document.getElementById(id);

/* ============================== assets ============================== */
const ASSET_DATA=__ASSETS__;
const SPRITES={}; // slot -> {img:canvas, w,h, baseY}
function keyMagenta(img){
  const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
  const g=c.getContext('2d');g.drawImage(img,0,0);
  const d=g.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=0;i<p.length;i+=4){
    const r=p[i],gr=p[i+1],b=p[i+2];
    const m=Math.min(r,b)-gr;
    if(m>90){p[i+3]=0}
    else if(m>28){const t=(m-28)/62;p[i+3]=Math.round(p[i+3]*(1-t));p[i]=Math.round(lerp(r,gr,.6));p[i+2]=Math.round(lerp(b,gr,.6))}
  }
  g.putImageData(d,0,0);
  // find lowest opaque row for foot anchoring
  let baseY=c.height-1;
  outer:for(let y=c.height-1;y>=0;y--){for(let x=0;x<c.width;x+=3){if(p[(y*c.width+x)*4+3]>40){baseY=y;break outer}}}
  return {img:c,w:c.width,h:c.height,baseY:baseY+1};
}
function loadAssets(){
  const jobs=Object.entries(ASSET_DATA).map(([slot,uri])=>new Promise(res=>{
    const im=new Image();
    im.onload=()=>{SPRITES[slot]=slot.startsWith('terrain')?{img:im,w:im.width,h:im.height,baseY:im.height}:keyMagenta(im);res()};
    im.onerror=()=>res(); im.src=uri;
  }));
  return Promise.all(jobs);
}
function tinted(sp,color,alpha){ // cached tinted copy of a sprite
  const key='_t'+color+alpha; if(sp[key])return sp[key];
  const c=document.createElement('canvas');c.width=sp.w;c.height=sp.h;const g=c.getContext('2d');
  g.drawImage(sp.img,0,0);g.globalCompositeOperation='source-atop';g.globalAlpha=alpha;g.fillStyle=color;g.fillRect(0,0,sp.w,sp.h);
  sp[key]={img:c,w:sp.w,h:sp.h,baseY:sp.baseY};return sp[key];
}

/* ============================== audio ============================== */
let AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function tone(f,dur,type,vol,slide){const ac=audio();if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'triangle';o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),ac.currentTime+dur);
  g.gain.value=vol||.08;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);
  o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+dur);}
function noise(dur,vol,lp){const ac=audio();if(!ac)return;const n=ac.createBufferSource(),buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  n.buffer=buf;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=lp||900;
  const g=ac.createGain();g.gain.value=vol||.1;n.connect(f).connect(g).connect(ac.destination);n.start();}
const SFX={
  hit(){noise(.09,.14,1400);tone(120,.08,'square',.05,-40)},
  slam(){noise(.28,.22,420);tone(70,.3,'sine',.16,-30)},
  swing(){noise(.07,.05,2400)},
  hurt(){tone(180,.14,'sawtooth',.07,-90)},
  drop(){tone(660,.2,'triangle',.07,120);setTimeout(()=>tone(880,.25,'triangle',.06,80),90)},
  rare(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.4,'triangle',.08),i*95))},
  relic(){[392,523,659,784,988].forEach((f,i)=>setTimeout(()=>tone(f,.5,'sine',.07),i*120))},
  pickup(){tone(520,.08,'triangle',.06,60)},
  level(){[440,554,659].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.07),i*80))},
  death(){tone(220,1.2,'sawtooth',.09,-160);noise(.7,.12,500)},
  horn(){tone(146,.9,'sawtooth',.10,8);setTimeout(()=>tone(146,1.4,'sawtooth',.12,4),950)},
  found(){[262,330,392,523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.8,'sine',.06),i*150))},
  dodge(){noise(.08,.05,3000)},
};

/* ============================== camera ============================== */
const cam={x:0,y:0,zoom:.95,pitch:54,persp:.00095,anchor:.56,fog:.55,tilt:1,shakeT:0,shakeA:0,tx:0,ty:0};
const CAM_PRESETS={
  'Miniature':{zoom:1.08,pitch:52,persp:.0013,anchor:.58,fog:.6,tilt:1},
  'ARPG':{zoom:.85,pitch:62,persp:.0006,anchor:.52,fog:.4,tilt:0},
  'High Table':{zoom:.75,pitch:74,persp:.00025,anchor:.5,fog:.25,tilt:0},
};
let W=innerWidth,H=innerHeight;
function project(wx,wy,wz){
  const relX=wx-cam.x,relY=wy-cam.y;
  const depth=clamp(1+relY*cam.persp,.55,1.9);
  const s=cam.zoom*depth;
  return {x:W/2+relX*s+cam.tx, y:H*cam.anchor+relY*s*Math.cos(cam.pitch*RAD)-(wz||0)*s+cam.ty, s};
}
function screenToWorld(sx,sy){
  const cp=Math.cos(cam.pitch*RAD);
  let relY=(sy-H*cam.anchor)/(cam.zoom*cp);
  for(let i=0;i<3;i++){const d=clamp(1+relY*cam.persp,.55,1.9);relY=(sy-H*cam.anchor)/(cam.zoom*cp*d);}
  const d=clamp(1+relY*cam.persp,.55,1.9);
  return {x:cam.x+(sx-W/2)/(cam.zoom*d), y:cam.y+relY};
}
function shake(a){cam.shakeA=Math.max(cam.shakeA,a);cam.shakeT=.28}

/* ============================== game state ============================== */
const SAVE_KEY='verdigris-founding-v1';
const DIRECTIONS={
  str:{label:'Arm of the Hearth',sub:'Strength-leaning',sprite:'scion_str',
    desc:'You guard the granary walk and wrestle the other young ones into the dust. Heavy work has made you heavy-handed.',
    stats:{str:7,dex:4,int:3},intro:'The sparring post waits by the granary. Strike it.',
    firstItem:()=>makeItem({type:'axe',material:'copper',level:1,name:'Worn Copper Axe'})},
  dex:{label:'Far-Walker',sub:'Dexterity-leaning',sprite:'scion_dex',
    desc:'You range the hills beyond the herds — snares, tracks, long silences. You came back this morning with hare and news of smoke.',
    stats:{str:4,dex:7,int:3},intro:'Your spear stands in the practice target. Take it back.',
    firstItem:()=>makeItem({type:'spear',material:'flint',level:1,name:'Flint-Tipped Spear'})},
  int:{label:'Bronze-Hand',sub:'Intelligence-leaning',sprite:'scion_int',
    desc:'You keep the crucible and the rites of the pour. The elders say the metal listens to you. It is nearly true.',
    stats:{str:3,dex:4,int:7},intro:'A fresh-cast blade cools on the anvil. Claim your work.',
    firstItem:()=>makeItem({type:'blade',material:'bronze',level:1,name:'Fresh-Cast Blade'})},
};
const SCION_NAMES=['Aruna','Tereth','Kavan','Ishme','Bel-Adan','Sarai','Ninsun','Ashkur','Ludari','Ekur','Vessa','Tolun','Meru','Anitta','Harev'];
function defaultHouse(){return{name:null,founded:false,standing:0,stores:[],knowledge:[],relicPool:[],lineage:[],cleared:[],unlocked:['hearthstead'],scionCount:0}}
let house=defaultHouse();
let scion=null;      // current character record
let player=null;     // live actor in instance
let state='boot';    // boot|title|direction|instance|map|dead|founded
let currentNode=null;
let entities=[],effects=[],floaters=[],scenery=[],groundLoot=[],ambient=[];
let worldSeed=1,arenaR=1300;
let hitstop=0,timeAlive=0,introTask=null,crisisTimer=-1,exitStandard=null,pendingLevelUps=0;

function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({house,scion:scion?{...scion,}:null}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY));if(d&&d.house){house=d.house;scion=d.scion||null;return true}}catch(e){}return false}

/* ============================== items ============================== */
const WEAPONS={
  blade:{label:'Short Blade',base:7,speed:.42,reach:95,arc:100,scaling:'dex',
    ability:'Flurry — a fast triple cut',desc:'quick cadence'},
  spear:{label:'Spear',base:9,speed:.62,reach:150,arc:34,scaling:'dex',
    ability:'Lunge — a driving thrust with reach',desc:'long thrust'},
  axe:{label:'War Axe',base:12,speed:.78,reach:105,arc:150,scaling:'str',
    ability:'Reaping Sweep — a full circle cut',desc:'heavy arc'},
  maul:{label:'Stone Maul',base:16,speed:1.05,reach:100,arc:120,scaling:'str',
    ability:'Ground Slam — breaks the earth around you',desc:'slow, brutal'},
};
const MATERIALS={
  stone:{mult:.85,q:0},flint:{mult:.95,q:0},copper:{mult:1,q:0},
  bronze:{mult:1.18,q:1},'river bronze':{mult:1.3,q:2},obsidian:{mult:1.26,q:2},'star bronze':{mult:1.5,q:3},
};
const ARMORS={
  'hide wraps':{def:4,q:0},'linen cuirass':{def:7,q:0},'boiled leather':{def:10,q:1},
  'bronze-scaled vest':{def:15,q:2},'lamellar of plates':{def:20,q:3},
};
const TRINKETS=[
  {name:'Clay Charm',mod:{life:12},q:0},{name:'Boar-Tusk Pendant',mod:{str:2},q:1},
  {name:'Hawk-Bone Whistle',mod:{dex:2},q:1},{name:'Crucible Bead',mod:{int:2},q:1},
  {name:'Ember Amulet',mod:{resist:12},q:2},{name:'Warden-Seed in Amber',mod:{life:20,resist:8},q:3},
];
const MODS=[
  {name:'of the Ox',stat:'str',v:2,q:1},{name:'of the Hare',stat:'dex',v:2,q:1},{name:'of the Owl',stat:'int',v:2,q:1},
  {name:'keen',stat:'crit',v:8,q:1},{name:'weighted',stat:'dmg',v:3,q:1},{name:'blooded',stat:'lifeOnKill',v:6,q:2},
  {name:'of the Old Road',stat:'speed',v:18,q:2},{name:'warded',stat:'resist',v:10,q:2},
];
let itemSerial=1;
function makeItem(opt){
  const rng=Math.random;
  const slot=opt.slot||'weapon';
  const it={id:'it'+(itemSerial++),slot,mods:[],history:[],level:opt.level||1,q:0};
  if(slot==='weapon'){
    it.type=opt.type||pick(rng,Object.keys(WEAPONS));
    it.material=opt.material||pick(rng,Object.keys(MATERIALS));
    const w=WEAPONS[it.type],m=MATERIALS[it.material];
    it.q=m.q; it.dmg=Math.round((w.base+it.level*1.6)*m.mult);
    it.name=opt.name||(cap(it.material)+' '+w.label);
  }else if(slot==='armor'){
    it.material=opt.material||pick(rng,Object.keys(ARMORS));
    const a=ARMORS[it.material];it.q=a.q;it.def=a.def+Math.round(it.level*1.2);
    it.name=opt.name||cap(it.material);
  }else{
    const t=opt.trinket||pick(rng,TRINKETS);it.q=t.q;it.mod=t.mod;it.name=t.name;
  }
  const modCount=opt.modCount!=null?opt.modCount:(rng()<.45?1:0)+(rng()<.15?1:0);
  const pool=[...MODS];
  for(let i=0;i<modCount&&pool.length;i++){
    const m=pool.splice(Math.floor(rng()*pool.length),1)[0];
    it.mods.push(m);it.q=Math.max(it.q,m.q);
    if(m.stat!=='crit'&&m.stat!=='dmg')it.name=(m.name.startsWith('of')?it.name+' '+m.name:cap(m.name)+' '+it.name.replace(/^(Keen|Weighted|Blooded|Warded) /,''));
  }
  if(opt.q!=null)it.q=opt.q;
  return it;
}
function cap(s){return s.replace(/(^|\s)\w/g,c=>c.toUpperCase())}
function itemStatText(it){
  const bits=[];
  if(it.slot==='weapon'){const w=WEAPONS[it.type];bits.push(it.dmg+' dmg · '+w.desc+' · scales '+w.scaling.toUpperCase())}
  if(it.slot==='armor')bits.push(it.def+' defense');
  if(it.mod)bits.push(Object.entries(it.mod).map(([k,v])=>'+'+v+' '+k).join(', '));
  for(const m of it.mods)bits.push(m.name+' (+'+m.v+' '+m.stat+')');
  return bits.join(' · ');
}
const QLABEL=['common','fine','worked','masterwork','relic'];

/* ============================== actors ============================== */
/* One schema for everything that fights. Enemies are actors with gear and
   levels, never a separate math universe. */
function makeActor(o){
  const a={
    id:'a'+Math.random().toString(36).slice(2,8),
    kind:o.kind, name:o.name, level:o.level||1,
    str:o.str||5,dex:o.dex||5,int:o.int||4,
    x:o.x||0,y:o.y||0,face:0,vx:0,vy:0,
    sprite:o.sprite,tint:o.tint||null,scale:o.scale||1,
    weapon:o.weapon||null,armor:o.armor||null,trinket:o.trinket||null,
    resist:o.resist||0,speed:o.speed||210,
    alive:true,attackT:0,attackPhase:null,attackDef:null,cooldown:0,hurtT:0,dodgeT:0,dodgeCd:0,
    ai:o.ai||null,aiT:Math.random()*.5,tele:null,proj:o.proj||false,deadT:0,bob:Math.random()*TAU,
    lifeOnKill:0,critBonus:0,dmgBonus:0,
  };
  recalc(a);a.life=a.lifeMax;a.breath=a.breathMax;
  return a;
}
function recalc(a){
  let str=a.str,dex=a.dex,int=a.int,def=0,resist=a.resist||0,life0=0,spd=0,crit=0,dmgB=0,lok=0;
  for(const it of [a.weapon,a.armor,a.trinket]){
    if(!it)continue;
    if(it.def)def+=it.def;
    if(it.mod)for(const [k,v] of Object.entries(it.mod)){if(k==='life')life0+=v;else if(k==='resist')resist+=v;else if(k==='str')str+=v;else if(k==='dex')dex+=v;else if(k==='int')int+=v}
    for(const m of it.mods||[]){
      if(m.stat==='str')str+=m.v;else if(m.stat==='dex')dex+=m.v;else if(m.stat==='int')int+=m.v;
      else if(m.stat==='crit')crit+=m.v;else if(m.stat==='dmg')dmgB+=m.v;else if(m.stat==='speed')spd+=m.v;
      else if(m.stat==='resist')resist+=m.v;else if(m.stat==='lifeOnKill')lok+=m.v;
    }
  }
  a.eff={str,dex,int};
  a.lifeMax=Math.round((a.kind==='player'?52:34)+str*4.2+a.level*7+life0);
  a.breathMax=Math.round(50+int*5);
  a.breathRegen=6+int*.9;
  a.defense=Math.round(def+dex*.8);
  a.resistEff=resist;
  a.moveSpeed=(a.speed+spd)*(house.knowledge.includes('marsh-paths')&&a.kind==='player'?1.08:1);
  a.critChance=clamp(3+dex*.9+crit,0,60);
  a.dmgBonus=dmgB;a.lifeOnKill=lok;
}
function weaponOf(a){return a.weapon?WEAPONS[a.weapon.type]:{label:'Fists',base:3,speed:.5,reach:70,arc:90,scaling:'str',desc:'bare hands',ability:'Shove'}}
function attackDamage(a,mult){
  const w=weaponOf(a);
  const scale=w.scaling==='str'?a.eff.str:a.eff.dex;
  let dmg=((a.weapon?a.weapon.dmg:w.base)+a.dmgBonus)*(1+scale*.035)*(mult||1);
  let crit=false;
  if(Math.random()*100<a.critChance){dmg*=1.7;crit=true}
  return {dmg,crit};
}
function applyDamage(target,raw,src,opts){
  opts=opts||{};
  let dmg=raw*100/(100+target.defense);
  if(opts.magic)dmg*=Math.max(.25,1-target.resistEff/100);
  if(target.dodgeT>0)return 0; // i-frames
  dmg=Math.max(1,Math.round(dmg));
  target.life-=dmg;target.hurtT=.22;
  floaters.push({x:target.x,y:target.y,z:110*target.scale,txt:''+dmg,t:0,col:opts.crit?'#ffd76a':(target.kind==='player'?'#ff8a7a':'#e8dfca'),big:opts.crit});
  if(opts.knock){const an=angTo(src.x,src.y,target.x,target.y);target.vx+=Math.cos(an)*opts.knock;target.vy+=Math.sin(an)*opts.knock}
  if(target.kind==='player'){SFX.hurt();shake(5)}else SFX.hit();
  spawnFx('impact',target.x,target.y,{z:80*target.scale});
  hitstop=Math.max(hitstop,opts.crit?.09:.05);
  if(target.life<=0&&target.alive){kill(target,src)}
  return dmg;
}
function kill(a,src){
  a.alive=false;a.deadT=0;a.life=0;
  spawnFx('deathring',a.x,a.y,{});spawnFx('dust',a.x,a.y,{n:10});
  if(a.kind==='player'){onScionDeath(src)}
  else{
    SFX.hit();
    if(src&&src.kind==='player'){
      const xp=10+a.level*7;gainXP(xp);
      if(src.lifeOnKill){src.life=Math.min(src.lifeMax,src.life+src.lifeOnKill);}
      rollDrop(a);
    }
  }
}

/* ============================== player control ============================== */
const keys={},mouse={x:0,y:0,down:false,rdown:false};
let aimAngle=0;
function playerUpdate(dt){
  const p=player;if(!p||!p.alive)return;
  const mw=screenToWorld(mouse.x,mouse.y);
  aimAngle=angTo(p.x,p.y,mw.x,mw.y);
  if(!p.attackPhase)p.face=aimAngle;
  let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0);
  const moving=dx||dy;
  if(moving){const l=Math.hypot(dx,dy);dx/=l;dy/=l}
  const inAtk=p.attackPhase==='windup'||p.attackPhase==='active';
  const spd=p.moveSpeed*(inAtk?.25:1)*(p.dodgeT>0?2.4:1);
  const ax=p.dodgeT>0?Math.cos(p.dodgeDir)*spd:dx*spd, ay=p.dodgeT>0?Math.sin(p.dodgeDir)*spd:dy*spd;
  p.vx=lerp(p.vx,ax,1-Math.pow(.0008,dt));p.vy=lerp(p.vy,ay,1-Math.pow(.0008,dt));
  tryMove(p,p.vx*dt,p.vy*dt);
  if(moving&&Math.random()<dt*6)spawnFx('step',p.x,p.y,{});
  // attacks
  p.cooldown-=dt;p.dodgeT-=dt;p.dodgeCd-=dt;
  if(mouse.down&&!p.attackPhase&&p.cooldown<=0)startAttack(p,'primary');
  if(mouse.rdown&&!p.attackPhase&&p.cooldown<=0)startAttack(p,'skill');
  stepAttack(p,dt);
  p.breath=Math.min(p.breathMax,p.breath+p.breathRegen*dt);
}
function dodge(){
  const p=player;if(!p||!p.alive||p.dodgeCd>0||p.breath<15)return;
  p.breath-=15;p.dodgeT=.24;p.dodgeCd=.55;p.attackPhase=null;
  let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0);
  p.dodgeDir=(dx||dy)?Math.atan2(dy,dx):p.face;
  SFX.dodge();spawnFx('dust',p.x,p.y,{n:6});
}
function tryMove(a,mx,my){
  let nx=a.x+mx,ny=a.y+my;
  for(const s of scenery){if(!s.solid)continue;const d=dist(nx,ny,s.x,s.y);if(d<s.r+26){const an=angTo(s.x,s.y,nx,ny);nx=s.x+Math.cos(an)*(s.r+26);ny=s.y+Math.sin(an)*(s.r+26)}}
  const d0=Math.hypot(nx,ny);if(d0>arenaR){nx*=arenaR/d0;ny*=arenaR/d0}
  a.x=nx;a.y=ny;
}
/* Attack definitions resolve per-weapon: the drop changes the moveset. */
function startAttack(a,kind){
  const w=weaponOf(a);
  const defs={
    primary:{
      arc:{shape:'arc',reach:w.reach,arcDeg:w.arc,windup:w.speed*.32,active:.14,recover:w.speed*.4,mult:1,knock:120},
      thrust:{shape:'thrust',reach:w.reach,arcDeg:22,windup:w.speed*.3,active:.12,recover:w.speed*.38,mult:1.05,knock:90},
    },
    skill:{
      blade:{shape:'flurry',reach:w.reach,arcDeg:80,windup:.12,active:.5,recover:.25,mult:.55,cost:22,hits:3},
      spear:{shape:'lunge',reach:w.reach+95,arcDeg:18,windup:.28,active:.16,recover:.4,mult:1.7,cost:25,knock:240,dash:190},
      axe:{shape:'sweep',reach:w.reach+15,arcDeg:360,windup:.42,active:.2,recover:.5,mult:1.45,cost:28,knock:200},
      maul:{shape:'slam',reach:135,arcDeg:360,windup:.5,active:.16,recover:.55,mult:1.9,cost:34,knock:320,magicless:true},
    }
  };
  let def;
  if(kind==='primary')def=defs.primary[w.desc==='long thrust'?'thrust':'arc'];
  else{def=defs.skill[a.weapon?a.weapon.type:'blade']||defs.skill.blade;
    if(a.breath<def.cost){toast('Winded — no breath','');return}
    a.breath-=def.cost;}
  a.attackDef=def;a.attackPhase='windup';a.attackT=0;a.attackHits=0;a.face=aimAngle;
  if(def.dash){a.vx=Math.cos(a.face)*def.dash*4;a.vy=Math.sin(a.face)*def.dash*4}
}
function stepAttack(a,dt){
  if(!a.attackPhase)return;
  const d=a.attackDef;a.attackT+=dt;
  if(a.attackPhase==='windup'&&a.attackT>=d.windup){
    a.attackPhase='active';a.attackT=0;SFX.swing();
    if(d.shape==='slam'){SFX.slam();shake(11);spawnFx('slam',a.x,a.y,{r:d.reach});spawnFx('debris',a.x,a.y,{n:14})}
    else spawnFx(d.shape==='thrust'||d.shape==='lunge'?'thrustfx':'arcfx',a.x,a.y,{ang:a.face,reach:d.reach,arc:d.arcDeg*RAD,owner:a});
  }else if(a.attackPhase==='active'){
    const hitTimes=d.hits?d.hits:1;
    const interval=d.active/hitTimes;
    while(a.attackHits<hitTimes&&a.attackT>=interval*(a.attackHits+ (d.hits?1:0.001))){
      a.attackHits++;
      if(d.hits&&a.attackHits>1)spawnFx('arcfx',a.x,a.y,{ang:a.face+(a.attackHits%2?.35:-.35),reach:d.reach,arc:d.arcDeg*RAD,owner:a});
      resolveHits(a,d);
    }
    if(a.attackT>=d.active){a.attackPhase='recover';a.attackT=0}
  }else if(a.attackPhase==='recover'&&a.attackT>=d.recover){
    a.attackPhase=null;a.cooldown=.02;
  }
}
function resolveHits(a,d){
  const targets=a.kind==='player'?entities.filter(e=>e.alive&&e.kind!=='player'):[player];
  for(const t of targets){
    if(!t||!t.alive)continue;
    const dd=dist(a.x,a.y,t.x,t.y);
    if(dd>d.reach+30*t.scale)continue;
    if(d.arcDeg<360&&Math.abs(angDiff(a.face,angTo(a.x,a.y,t.x,t.y)))>d.arcDeg*RAD/2+.25)continue;
    const {dmg,crit}=attackDamage(a,d.mult);
    applyDamage(t,dmg,a,{crit,knock:d.knock||0});
  }
}

    str:5,dex:6,int:3,ai:'melee'},
  spearman:{name:'Ashmark Spearman',sprite:'raider',tint:'#5a2c20',scale:1.12,speed:180,

  shade:{name:'Barrow Shade',sprite:null,speed:150,proj:true,str:3,dex:5,int:8,resist:30,
    weapon:()=>makeItem({type:'blade',material:'stone',level:2,modCount:0,name:'Grave Chill'}),ai:'ranged'},
  chieftain:{name:'Ashmark Chieftain',sprite:'raider',tint:'#20303c',scale:1.28,speed:200,
    weapon:()=>makeItem({type:'axe',material:'bronze',level:4,modCount:1}),armor:()=>makeItem({slot:'armor',material:'boiled leather',level:3}),

    str:13,dex:7,int:9,resist:25,ai:'boss',elite:true},
};
function spawnEnemy(key,lvl,x,y){
  const r=ROSTER[key];
  const a=makeActor({kind:key,name:r.name,level:lvl,str:r.str+Math.floor(lvl*.8),dex:r.dex+Math.floor(lvl*.5),int:r.int,
    sprite:r.sprite,tint:r.tint,scale:r.scale||1,speed:r.speed,resist:r.resist||0,
    weapon:r.weapon?r.weapon():null,armor:r.armor?r.armor():null,ai:r.ai});
  a.rosterKey=key;a.elite=!!r.elite;
  a.x=x;a.y=y;entities.push(a);return a;
}
function enemyUpdate(a,dt){
  if(!a.alive||!player)return;
  a.bob+=dt*3;a.cooldown-=dt;
  const p=player,dd=dist(a.x,a.y,p.x,p.y);
  if(!p.alive){a.vx=lerp(a.vx,0,dt*4);a.vy=lerp(a.vy,0,dt*4);return}
  a.face=angTo(a.x,a.y,p.x,p.y);
  const w=weaponOf(a);
  if(a.tele){ // executing telegraphed strike
    a.tele.t+=dt;
    if(a.tele.t>=a.tele.dur){
      const t=a.tele;a.tele=null;a.cooldown=t.cd;
      if(t.kind==='melee'){
        spawnFx(t.shape==='thrust'?'thrustfx':'arcfx',a.x,a.y,{ang:a.face,reach:t.reach,arc:t.arc,owner:a,hostile:true});
        SFX.swing();
        if(dist(a.x,a.y,p.x,p.y)<t.reach+30&&Math.abs(angDiff(a.face,angTo(a.x,a.y,p.x,p.y)))<t.arc/2+.3){
          const {dmg,crit}=attackDamage(a,t.mult);applyDamage(p,dmg,a,{crit,knock:t.knock});
        }
      }else if(t.kind==='slamzone'){
        spawnFx('slam',t.x,t.y,{r:t.r,hostile:true});SFX.slam();shake(8);
        if(dist(p.x,p.y,t.x,t.y)<t.r){const {dmg}=attackDamage(a,t.mult);applyDamage(p,dmg,a,{knock:300,magic:t.magic})}
      }else if(t.kind==='bolt'){
        spawnProjectile(a,t.mult);
      }
    }
    return;
  }
  const desired=a.ai==='ranged'?420:w.reach*.75;
  if(a.ai==='ranged'&&dd<260){ // shades drift away
    a.vx=lerp(a.vx,-Math.cos(a.face)*a.moveSpeed,dt*3);a.vy=lerp(a.vy,-Math.sin(a.face)*a.moveSpeed,dt*3);
  }else if(dd>desired){
    a.vx=lerp(a.vx,Math.cos(a.face)*a.moveSpeed,dt*3);a.vy=lerp(a.vy,Math.sin(a.face)*a.moveSpeed,dt*3);
  }else{a.vx=lerp(a.vx,0,dt*6);a.vy=lerp(a.vy,0,dt*6)}
  tryMove(a,a.vx*dt,a.vy*dt);
  // separation
  for(const o of entities){if(o===a||!o.alive)continue;const d2=dist(a.x,a.y,o.x,o.y);if(d2<52){const an=angTo(o.x,o.y,a.x,a.y);a.x+=Math.cos(an)*(52-d2)*.4;a.y+=Math.sin(an)*(52-d2)*.4}}
  if(a.cooldown>0)return;
  // choose an attack, telegraph it
  if(a.ai==='ranged'){
    if(dd<620){a.tele={kind:'bolt',t:0,dur:.7,cd:1.6,mult:1};spawnFx('teleglow',a.x,a.y,{dur:.7})}
  }else if(a.ai==='boss'){
    if(dd<170&&Math.random()<.45){
      a.tele={kind:'slamzone',t:0,dur:.85,cd:1.4,x:p.x,y:p.y,r:150,mult:1.5,magic:true};
      spawnFx('telecircle',p.x,p.y,{r:150,dur:.85});
    }else if(dd<w.reach+40){
      a.tele={kind:'melee',t:0,dur:.55,cd:1.1,shape:'arc',reach:w.reach+20,arc:150*RAD,mult:1.1,knock:220};
      spawnFx('telearc',a.x,a.y,{ang:a.face,reach:w.reach+20,arc:150*RAD,dur:.55,owner:a});
    }
  }else if(dd<w.reach+25){
    const thrust=w.desc==='long thrust';
    a.tele={kind:'melee',t:0,dur:thrust?.6:.45,cd:1+Math.random()*.5,shape:thrust?'thrust':'arc',
      reach:w.reach+15,arc:(thrust?26:110)*RAD,mult:1,knock:130};
    spawnFx(thrust?'telethrust':'telearc',a.x,a.y,{ang:a.face,reach:w.reach+15,arc:(thrust?26:110)*RAD,dur:a.tele.dur,owner:a});
  }
}
function spawnProjectile(a,mult){
  const an=angTo(a.x,a.y,player.x,player.y);
  effects.push({kind:'bolt',x:a.x,y:a.y,z:70,vx:Math.cos(an)*430,vy:Math.sin(an)*430,t:0,ttl:1.8,owner:a,mult});
}

/* ============================== drops & loot ============================== */
function rollDrop(from){
  const r=Math.random();
  let chance=from.elite?1:.42;
  if(r>chance)return;
  let it=null,isRelic=false;
  if(house.relicPool.length&&Math.random()<(from.elite?.4:.12)){
    it=house.relicPool.splice(Math.floor(Math.random()*house.relicPool.length),1)[0];
    it.q=4;isRelic=true;
    it.history.push('Recovered at '+NODES[currentNode].name+' by '+scion.name);
  }else{
    const lvl=Math.max(1,from.level);
    const slotR=Math.random();
    it=makeItem({slot:slotR<.55?'weapon':slotR<.85?'armor':'trinket',level:lvl,q:from.elite?Math.max(2,undefined):undefined});
    if(from.elite&&it.q<2)it.q=2;
  }
  dropItem(it,from.x,from.y,isRelic);
}
function dropItem(it,x,y,isRelic){
  const an=Math.random()*TAU;
  groundLoot.push({item:it,x:x+Math.cos(an)*30,y:y+Math.sin(an)*30,z:120,vz:-40,t:0,relic:isRelic,
    vx:Math.cos(an)*60,vy:Math.sin(an)*60});
  if(isRelic){SFX.relic();toast('A relic returns: '+it.name,'relic')}
  else if(it.q>=3){SFX.rare();toast(it.name,'gold')}
  else if(it.q>=2)SFX.rare();
  else SFX.drop();
}
function nearestLoot(){
  let best=null,bd=90;
  for(const l of groundLoot){const d=dist(player.x,player.y,l.x,l.y);if(d<bd){bd=d;best=l}}
  return best;
}
function pickupLoot(l){
  groundLoot.splice(groundLoot.indexOf(l),1);
  scion.pack.push(l.item);
  l.item.history.push('Taken up by '+scion.name+(house.name?' of House '+house.name:''));
  SFX.pickup();toast('+ '+l.item.name,l.item.q>=3?'gold':'');
  renderInv();save();
}
function equipItem(it){
  const slot=it.slot;
  const cur=player[slot];
  if(cur){scion.pack.push(cur)}
  scion.pack.splice(scion.pack.indexOf(it),1);
  player[slot]=it;scion[slot]=it;
  it.history.push('Borne by '+scion.name);
  recalc(player);player.life=Math.min(player.life,player.lifeMax);
  renderInv();renderHUD();save();
}

/* ============================== XP / leveling ============================== */
function gainXP(n){
  scion.xp+=n;
  while(scion.xp>=xpNext(scion.level)){scion.xp-=xpNext(scion.level);scion.level++;player.level=scion.level;pendingLevelUps++;SFX.level();toast('The blood quickens — level '+scion.level,'gold');spawnFx('levelup',player.x,player.y,{})}
  if(pendingLevelUps&&!document.querySelector('.lvlup'))showLevelUp();
  renderHUD();
}
function xpNext(l){return Math.round(40*Math.pow(l,1.45))}
function showLevelUp(){
  const t=document.createElement('div');t.className='toast lvlup';
  t.innerHTML='<span style="margin-right:8px;color:var(--gold)">Shape the growth:</span>';
  [['Strength','str'],['Dexterity','dex'],['Intelligence','int']].forEach(([lb,k])=>{
    const b=document.createElement('button');b.textContent='+2 '+lb;
    b.onclick=()=>{scion[k]+=2;player[k]+=2;recalc(player);player.life=Math.min(player.lifeMax,player.life+10);pendingLevelUps--;t.remove();renderHUD();renderInv();save();if(pendingLevelUps)showLevelUp()};
    t.appendChild(b);
  });
  el('toasts').appendChild(t);
}

/* ============================== effects & particles ============================== */
function spawnFx(kind,x,y,o){
  o=o||{};
  if(!FX_ON&&kind!=='slam'&&kind!=='telecircle'&&kind!=='telearc'&&kind!=='telethrust')return;
  effects.push({kind,x,y,t:0,...o});
}
let FX_ON=true;
function fxUpdate(dt){
  for(let i=effects.length-1;i>=0;i--){
    const e=effects[i];e.t+=dt;
    if(e.kind==='bolt'){
      e.x+=e.vx*dt;e.y+=e.vy*dt;
      if(player&&player.alive&&dist(e.x,e.y,player.x,player.y)<40){
        const {dmg}=attackDamage(e.owner,e.mult);applyDamage(player,dmg,e.owner,{magic:true});effects.splice(i,1);continue;
      }
      if(e.t>e.ttl){effects.splice(i,1)}continue;
    }
    const ttl={arcfx:.22,thrustfx:.2,impact:.18,deathring:.6,dust:.55,slam:.55,debris:.7,step:.4,sparkle:2,teleglow:e.dur||.7,telecircle:e.dur||.8,telearc:e.dur||.5,telethrust:e.dur||.6,levelup:.9}[e.kind]||.5;
    if(e.t>ttl)effects.splice(i,1);
  }
  for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];f.t+=dt;f.z+=40*dt;if(f.t>.9)floaters.splice(i,1)}
  for(let i=groundLoot.length-1;i>=0;i--){
    const l=groundLoot[i];l.t+=dt;
    if(l.z>0||l.vz<0){l.vz+=560*dt;l.z-=l.vz*dt;l.x+=l.vx*dt;l.y+=l.vy*dt;if(l.z<=0){l.z=0;l.vz*=-.4;l.vx*=.5;l.vy*=.5;if(Math.abs(l.vz)<30)l.vz=0}}
  }
  // ambient
  if(FX_ON&&ambient.length<40&&Math.random()<dt*8){
    const an=Math.random()*TAU,r=Math.random()*arenaR*.9;
    ambient.push({x:cam.x+(Math.random()-.5)*1600,y:cam.y+(Math.random()-.5)*1000,z:Math.random()*60,t:0,ttl:4+Math.random()*4,kind:Math.random()<.6?'mote':'leaf',dx:(Math.random()-.5)*20,dz:Math.random()*10+4});
  }
  for(let i=ambient.length-1;i>=0;i--){const a=ambient[i];a.t+=dt;a.x+=a.dx*dt;a.z+=Math.sin(a.t*2)*a.dz*dt;if(a.t>a.ttl)ambient.splice(i,1)}
}

let waveIdx=0,nodeCleared=false;
function enterNode(key){
  currentNode=key;const def=NODES[key];
  state='instance';entities=[];effects=[];floaters=[];groundLoot=[];exitStandard=null;
  waveIdx=0;nodeCleared=false;crisisTimer=-1;introTask=null;
  arenaR=1300;makeScenery(key);
  // spawn player
  if(!player)spawnPlayerActor();
  player.x=0;player.y=520;player.life=player.lifeMax;player.breath=player.breathMax;player.alive=true;
  cam.x=0;cam.y=player.y;
  el('locname').textContent=def.name;el('locsub').textContent=def.sub;
  hideOverlay();closePanels();
  if(key==='hearthstead'&&!house.cleared.includes('hearthstead')){beginIntro()}
  else{spawnWave()}
  renderHUD();save();
}
function spawnPlayerActor(){
  const d=DIRECTIONS[scion.dir];
  player=makeActor({kind:'player',name:scion.name,level:scion.level,str:scion.str,dex:scion.dex,int:scion.int,
    sprite:d.sprite,speed:225,weapon:scion.weapon,armor:scion.armor,trinket:scion.trinket});
  player.resist=(house.knowledge.includes('stone-rites')?12:0);recalc(player);player.life=player.lifeMax;
}
function beginIntro(){
  const d=DIRECTIONS[scion.dir];
  introTask={t:0,done:false};
  toast(d.intro,'gold');
  // a first-item opportunity stands in the world
  const it=d.firstItem();
  groundLoot.push({item:it,x:120,y:280,z:0,vz:0,vx:0,vy:0,t:0,first:true});
  crisisTimer=-1;
}
function spawnWave(){
  const def=NODES[currentNode];
  if(!def.waves){nodeExit();return}
  if(waveIdx>=def.waves.length){nodeExit();return}
  const wave=def.waves[waveIdx];
  wave.forEach(([k,l],i)=>{
    const an=-Math.PI/2+(i-(wave.length-1)/2)*.5;
    const e=spawnEnemy(k,l,Math.cos(an)*760,Math.sin(an)*640-80);
    spawnFx('dust',e.x,e.y,{n:6});
  });
  if(waveIdx===0)toast('They come.','');
  waveIdx++;
}
function checkWave(){
  if(state!=='instance'||nodeCleared)return;
  if(introTask)return;
  if(entities.some(e=>e.alive))return;
  const def=NODES[currentNode];
  if(def.waves&&waveIdx<def.waves.length){setTimeout(spawnWave,900);waveIdx=waveIdx; if(def.waves[waveIdx-1])toast('More shapes on the ridge…','');return}
  nodeExit();
}
function nodeExit(){
  if(nodeCleared)return;nodeCleared=true;
  exitStandard={x:0,y:-720};
  toast('The ground is yours. Plant the standard (E).','house');
}
function completeNode(){
  const def=NODES[currentNode];
  const first=!house.cleared.includes(currentNode);
  if(first){
    house.cleared.push(currentNode);
    for(const n of def.next||[])if(!house.unlocked.includes(n))house.unlocked.push(n);
    house.standing+=def.climax?30:(def.optional?14:10);
    if(def.knowledge&&!house.knowledge.includes(def.knowledge.id)){
      house.knowledge.push(def.knowledge.id);
      toast(def.knowledge.label+' — House knowledge gained','house');
    }
  }
  // extraction beat: unequipped pack goes to the House stores
  const banked=scion.pack.splice(0);
  house.stores.push(...banked);
  recalc(player);
  save();
  if(def.climax&&!house.founded){showFounding();return}
  showNodeSummary(def,banked,first);
}

function onScionDeath(src){
  SFX.death();shake(14);
  state='dead';
  const killer=src&&src.name?src.name:'the dark';
  // significant carried equipment becomes relics
  const relics=[];
  for(const it of [scion.weapon,scion.armor,scion.trinket]){
    if(it){it.history.push('Carried by '+scion.name+' at their death — '+NODES[currentNode].name);house.relicPool.push(it);relics.push(it)}
  }
  // pack (unbanked loot) is lost with the body
  const lost=scion.pack.length;
  house.lineage.push({name:scion.name,dir:scion.dir,level:scion.level,end:NODES[currentNode].name,by:killer});
  scion=null;player.alive=false;
  save();
  setTimeout(()=>showDeathScreen(relics,lost,killer),1400);
}

const cv=el('game'),ctx=cv.getContext('2d');
function resize(){W=innerWidth;H=innerHeight;cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();

function drawGround(){
  const def=currentNode?NODES[currentNode]:null;
  const terr=SPRITES[def&&(def.set==='marsh'||def.set==='barrow'||def.set==='circle')?'terrain4':'terrain1'];
  const cp=Math.cos(cam.pitch*RAD);
  // sky/backdrop above horizon
  const hor=project(cam.x,cam.y-2600,0).y;
  const grd=ctx.createLinearGradient(0,0,0,Math.max(hor,1));
  grd.addColorStop(0,'#0d0f12');grd.addColorStop(1,'#1c1a14');
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,Math.max(hor,0)+2);
  if(!terr){ctx.fillStyle='#241f16';ctx.fillRect(0,hor,W,H-hor);return}
  const bandH=14;
  const startY=Math.max(0,Math.floor(hor));
  for(let y=startY;y<H;y+=bandH){
    const wm=screenToWorld(W/2,y+bandH/2);
    const d=clamp(1+(wm.y-cam.y)*cam.persp,.55,1.9);
    const s=cam.zoom*d*.9;
    ctx.save();
    ctx.beginPath();ctx.rect(0,y,W,bandH+1);ctx.clip();
    ctx.translate(W/2,y);ctx.scale(s,s*cp);
    const tw=terr.w;
    const mod=(v,m)=>((v%m)+m)%m;
    const ox=-mod(cam.x,tw),oy=-mod(wm.y,tw);
    for(let tx=-Math.ceil(W/(2*s*tw))-1;tx<=Math.ceil(W/(2*s*tw))+1;tx++){
      for(let ty=-1;ty<=1;ty++)ctx.drawImage(terr.img,ox+tx*tw,oy+ty*tw,tw,tw);
    }
    ctx.restore();
    // distance shading
    const shade=clamp((1-(y-startY)/(H-startY))*cam.fog,0,.85);
    if(shade>0.02){ctx.fillStyle='rgba(13,15,18,'+shade+')';ctx.fillRect(0,y,W,bandH+1)}
  }
  // arena edge fade
  const c0=project(0,0,0);
  ctx.save();
  const eg=ctx.createRadialGradient(c0.x,c0.y,arenaR*cam.zoom*.75,c0.x,c0.y,arenaR*cam.zoom*1.25);
  eg.addColorStop(0,'rgba(10,8,6,0)');eg.addColorStop(1,'rgba(10,8,6,.75)');
  ctx.fillStyle=eg;ctx.fillRect(0,0,W,H);ctx.restore();
}
function drawShadow(x,y,r,alpha){
  const p=project(x,y,0);
  ctx.save();ctx.globalAlpha=alpha||.4;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(p.x,p.y,r*p.s,r*p.s*Math.cos(cam.pitch*RAD)*.9,0,0,TAU);ctx.fill();ctx.restore();
}
function drawSpriteBillboard(sp,x,y,z,h,opts){
  opts=opts||{};
  const p=project(x,y,z||0);
  const scale=h*p.s/sp.h;
  const w=sp.w*scale;
  ctx.save();
  ctx.translate(p.x,p.y);
  if(opts.rot)ctx.rotate(opts.rot);
  if(opts.flip)ctx.scale(-1,1);
  if(opts.squash)ctx.transform(1/opts.squash,0,0,opts.squash,0,0);
  if(opts.alpha!=null)ctx.globalAlpha=opts.alpha;
  const dy=sp.baseY*scale;
  ctx.drawImage(sp.img,-w/2,-dy,w,sp.h*scale);
  ctx.restore();
  return p;
}
function drawActor(a){
  const hurtFlash=a.hurtT>0;
  const baseH={player:150,raider:150,spearman:150,shade:150,chieftain:170,warden:210}[a.kind]||150;
  const h=baseH*a.scale;
  drawShadow(a.x,a.y,34*a.scale,a.alive?.42:.2);
  let sp=a.sprite?SPRITES[a.sprite]:null;
  if(sp&&a.tint)sp=tinted(sp,a.tint,.42);
  if(sp&&hurtFlash)sp=tinted(sp,'#ffffff',.65);
  const moving=Math.hypot(a.vx,a.vy)>30;
  const bobA=moving?Math.sin(performance.now()/90)*.04:Math.sin(a.bob+performance.now()/600)*.015;
  let rot=bobA,squash=1,alpha=1,z=0;
  if(a.attackPhase==='windup')rot+=(a.face>Math.PI/2||a.face<-Math.PI/2?1:-1)*-.14*(a.attackT/(a.attackDef.windup||.3));
  if(a.attackPhase==='active'){rot+=(a.face>Math.PI/2||a.face<-Math.PI/2?1:-1)*.18;squash=1.04}
  if(a.dodgeT>0){rot+=(a.dodgeDir>Math.PI/2||a.dodgeDir<-Math.PI/2?-1:1)*.5;alpha=.75}
  if(!a.alive){const t=Math.min(1,a.deadT/.7);rot=(a.face>Math.PI/2||a.face<-Math.PI/2?-1:1)*1.45*t;alpha=1-Math.max(0,(a.deadT-1.2)/1.2);z=-6*t}
  if(a.kind==='shade'||!sp){drawShade(a,h,alpha);return}
  const flip=Math.cos(a.face)<0;
  drawSpriteBillboard(sp,a.x,a.y,z,h,{flip,rot:flip?-rot:rot,squash,alpha:alpha*(a.dodgeT>0?.7:1)});
  if(a.alive&&a.kind!=='player'){ // compact life bar: same math universe, visible
    const p=project(a.x,a.y,h+18);
    const bw=48*a.scale*p.s/cam.zoom*cam.zoom;
    ctx.save();
    ctx.fillStyle='rgba(15,12,10,.8)';ctx.fillRect(p.x-bw/2,p.y,bw,4);
    ctx.fillStyle=a.elite?'#c98be0':'#a5493c';ctx.fillRect(p.x-bw/2,p.y,bw*clamp(a.life/a.lifeMax,0,1),4);
    if(a.elite){ctx.fillStyle='#d9b25f';ctx.font='10px Georgia';ctx.textAlign='center';ctx.fillText(a.name+' · lv '+a.level,p.x,p.y-4)}
    ctx.restore();
  }
  if(a.kind==='player'&&a.alive){ // facing tick
    const p=project(a.x+Math.cos(aimAngle)*46,a.y+Math.sin(aimAngle)*46,2);
    ctx.save();ctx.globalAlpha=.5;ctx.fillStyle='#d8cdb8';ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,TAU);ctx.fill();ctx.restore();
  }
}
function drawShade(a,h,alpha){
  const p=project(a.x,a.y,0);
  const t=performance.now()/1000;
  const hh=h*p.s/150*(1+Math.sin(t*2+a.bob)*.04);
  ctx.save();ctx.translate(p.x,p.y);ctx.globalAlpha=alpha*.85;
  const g=ctx.createLinearGradient(0,-hh,0,0);
  g.addColorStop(0,'rgba(112,134,140,0)');g.addColorStop(.4,'rgba(96,118,128,.55)');g.addColorStop(1,'rgba(40,52,60,.9)');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(0,-hh);
  ctx.bezierCurveTo(hh*.34,-hh*.7,hh*.3+Math.sin(t*3)*4,-hh*.25,hh*.16,0);
  ctx.bezierCurveTo(0,hh*.06,0,hh*.06,-hh*.16,0);
  ctx.bezierCurveTo(-hh*.3-Math.sin(t*2.6)*4,-hh*.25,-hh*.34,-hh*.7,0,-hh);
  ctx.fill();
  // ember eyes
  ctx.globalAlpha=alpha;ctx.fillStyle='#e8b45a';
  ctx.beginPath();ctx.arc(-hh*.06,-hh*.72,2.2,0,TAU);ctx.arc(hh*.06,-hh*.72,2.2,0,TAU);ctx.fill();
  ctx.restore();
  if(a.alive){
    const pp=project(a.x,a.y,h+14);
    ctx.save();ctx.fillStyle='rgba(15,12,10,.8)';ctx.fillRect(pp.x-24,pp.y,48,4);
    ctx.fillStyle='#7f9aa8';ctx.fillRect(pp.x-24,pp.y,48*clamp(a.life/a.lifeMax,0,1),4);ctx.restore();
  }
}
function drawSceneryItem(s){
  if(s.slot==='rock'){
    const p=project(s.x,s.y,0);
    drawShadow(s.x,s.y,20*s.scale,.3);
    ctx.save();ctx.translate(p.x,p.y);const r=22*s.scale*p.s;
    ctx.fillStyle='#4d453a';ctx.beginPath();ctx.moveTo(-r,-2);ctx.lineTo(-r*.5,-r*.72);ctx.lineTo(r*.4,-r*.8);ctx.lineTo(r,-r*.1);ctx.lineTo(r*.6,0);ctx.lineTo(-r,0);ctx.fill();
    ctx.fillStyle='#5d5443';ctx.beginPath();ctx.moveTo(-r*.5,-r*.72);ctx.lineTo(r*.4,-r*.8);ctx.lineTo(r*.2,-r*.3);ctx.fill();ctx.restore();return;
  }
  if(s.slot==='reed'){
    const p=project(s.x,s.y,0);
    ctx.save();ctx.translate(p.x,p.y);const hh=54*s.scale*p.s;
    const sway=Math.sin(performance.now()/900+s.sway)*.12;
    ctx.strokeStyle='#4a5a35';ctx.lineWidth=1.4*p.s;
    for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*3*p.s,0);ctx.quadraticCurveTo(i*3*p.s+sway*20,-hh*.6,i*4*p.s+sway*38,-hh*(0.8+Math.abs(i)*.07));ctx.stroke()}
    ctx.restore();return;
  }
  if(s.slot==='stone'){
    const p=project(s.x,s.y,0);
    drawShadow(s.x,s.y,26*s.scale,.34);
    ctx.save();ctx.translate(p.x,p.y);const hh=120*s.scale*p.s,ww=34*s.scale*p.s;
    ctx.fillStyle='#57544c';ctx.beginPath();ctx.moveTo(-ww/2,0);ctx.lineTo(-ww*.42,-hh);ctx.lineTo(ww*.3,-hh*1.04);ctx.lineTo(ww/2,-hh*.12);ctx.lineTo(ww*.3,0);ctx.fill();
    ctx.fillStyle='#68655b';ctx.beginPath();ctx.moveTo(-ww*.42,-hh);ctx.lineTo(ww*.3,-hh*1.04);ctx.lineTo(ww*.14,-hh*.55);ctx.lineTo(-ww*.3,-hh*.5);ctx.fill();
    ctx.fillStyle='rgba(90,168,138,.25)';ctx.fillRect(-ww*.2,-hh*.8,ww*.32,hh*.18);
    ctx.restore();return;
  }
  const sp=SPRITES[s.slot];if(!sp)return;
  const hts={tree:300,ruin:260,dwelling:230,shrine:200,wagon:150};
  drawShadow(s.x,s.y,(s.r||60)*.9,.32);
  drawSpriteBillboard(sp,s.x,s.y,0,(hts[s.slot]||200)*s.scale,{});
}
function drawLoot(l){

  if(q>=2||l.relic){ctx.globalAlpha=.28+Math.sin(t*3)*.08;const g=ctx.createLinearGradient(0,-70,0,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,col);ctx.fillStyle=g;ctx.fillRect(-3.2,-72,6.4,72);ctx.globalAlpha=1}

  ctx.beginPath();ctx.moveTo(0,-r*1.5);ctx.lineTo(r,0);ctx.lineTo(0,r*1.5);ctx.lineTo(-r,0);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.restore();
  const near=player&&dist(player.x,player.y,l.x,l.y)<90;
  if(near||q>=3||l.relic){
    ctx.save();ctx.font=(q>=3?'12px':'11px')+' "Segoe UI"';ctx.textAlign='center';
    ctx.fillStyle='rgba(15,12,9,.85)';const tw=ctx.measureText(l.item.name).width;
    ctx.fillRect(p.x-tw/2-6,p.y-r*1.5-20,tw+12,16);
    ctx.fillStyle=col;ctx.fillText(l.item.name,p.x,p.y-r*1.5-8);ctx.restore();

}
function drawEffect(e){
  const t=e.t;
  if(e.kind==='arcfx'||e.kind==='telearc'){
    const tele=e.kind==='telearc';
    const dur=tele?(e.dur||.5):.22;
    const k=clamp(t/dur,0,1);
    const p=project(e.x,e.y,0);
    ctx.save();ctx.translate(p.x,p.y);ctx.scale(1,Math.cos(cam.pitch*RAD));
    const R=e.reach*p.s;
    const a0=e.ang-e.arc/2,a1=e.ang+e.arc/2;
    if(tele){
      ctx.globalAlpha=.25+.2*k;ctx.fillStyle='#a5493c';
      ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,a0,a1);ctx.closePath();ctx.fill();
      ctx.globalAlpha=.8;ctx.strokeStyle='#c96a52';ctx.lineWidth=1.5;ctx.stroke();
    }else{
      const sweep=a0+(a1-a0)*k;
      const g=ctx.createRadialGradient(0,0,R*.3,0,0,R);
      g.addColorStop(0,'rgba(226,216,180,0)');g.addColorStop(1,'rgba(232,223,202,'+(0.5*(1-k))+')');
      ctx.fillStyle=g;
      ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,a0,sweep);ctx.closePath();ctx.fill();
      ctx.strokeStyle='rgba(240,232,210,'+(0.9*(1-k))+')';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(0,0,R*.92,Math.max(a0,sweep-.5),sweep);ctx.stroke();
    }
    ctx.restore();
  }else if(e.kind==='thrustfx'||e.kind==='telethrust'){
    const tele=e.kind==='telethrust';
    const dur=tele?(e.dur||.6):.2;const k=clamp(t/dur,0,1);
    const p=project(e.x,e.y,0);
    ctx.save();ctx.translate(p.x,p.y);ctx.scale(1,Math.cos(cam.pitch*RAD));ctx.rotate(e.ang);
    const R=e.reach*p.s;
    if(tele){ctx.globalAlpha=.3+.2*k;ctx.fillStyle='#a5493c';ctx.fillRect(0,-7,R,14);ctx.globalAlpha=.9;ctx.strokeStyle='#c96a52';ctx.strokeRect(0,-7,R,14)}
    else{
      const ext=R*Math.min(1,k*2.2);
      const g=ctx.createLinearGradient(0,0,ext,0);
      g.addColorStop(0,'rgba(232,223,202,0)');g.addColorStop(.8,'rgba(240,232,210,'+(0.75*(1-k))+')');g.addColorStop(1,'rgba(255,250,235,'+(0.9*(1-k))+')');
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(ext,-1.5);ctx.lineTo(ext+10,0);ctx.lineTo(ext,1.5);ctx.lineTo(0,4);ctx.fill();
    }
    ctx.restore();
  }else if(e.kind==='telecircle'){
    const k=clamp(t/(e.dur||.8),0,1);
    const p=project(e.x,e.y,0);
    ctx.save();ctx.translate(p.x,p.y);ctx.scale(1,Math.cos(cam.pitch*RAD));
    ctx.globalAlpha=.3+.25*k;ctx.fillStyle='#7a4b3a';
    ctx.beginPath();ctx.arc(0,0,e.r*p.s,0,TAU);ctx.fill();
    ctx.globalAlpha=.9;ctx.strokeStyle='#c96a52';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,e.r*p.s*k,0,TAU);ctx.stroke();ctx.restore();
  }else if(e.kind==='slam'){
    const k=clamp(t/.55,0,1);
    const p=project(e.x,e.y,0);
    ctx.save();ctx.translate(p.x,p.y);ctx.scale(1,Math.cos(cam.pitch*RAD));
    const R=(e.r||140)*p.s*(.3+.9*Math.pow(k,.6));
    ctx.globalAlpha=(1-k);
    ctx.strokeStyle=e.hostile?'#d98a5f':'#e5d9b8';ctx.lineWidth=5*(1-k)+1;
    ctx.beginPath();ctx.arc(0,0,R,0,TAU);ctx.stroke();
    ctx.strokeStyle='rgba(160,140,105,'+(0.5*(1-k))+')';ctx.lineWidth=10*(1-k);
    ctx.beginPath();ctx.arc(0,0,R*.8,0,TAU);ctx.stroke();
    ctx.restore();
  }else if(e.kind==='impact'){
    const k=clamp(t/.18,0,1);
    const p=project(e.x,e.y,e.z||70);
    ctx.save();ctx.translate(p.x,p.y);ctx.globalAlpha=1-k;
    ctx.fillStyle='#ffe9b0';
    const r=(6+18*k)*p.s;
    for(let i=0;i<5;i++){const an=i/5*TAU+e.x;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(an)*r*1.6,Math.sin(an)*r*1.6);ctx.lineTo(Math.cos(an+.5)*r*.4,Math.sin(an+.5)*r*.4);ctx.fill()}
    ctx.restore();
  }else if(e.kind==='deathring'){
    const k=clamp(t/.6,0,1);
    const p=project(e.x,e.y,0);
    ctx.save();ctx.translate(p.x,p.y);ctx.scale(1,Math.cos(cam.pitch*RAD));
    ctx.globalAlpha=1-k;ctx.strokeStyle='#c07a5a';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(0,0,(20+90*k)*p.s,0,TAU);ctx.stroke();ctx.restore();
  }else if(e.kind==='dust'||e.kind==='debris'||e.kind==='step'){
    const dur=e.kind==='step'?.4:(e.kind==='debris'?.7:.55);
    const k=clamp(t/dur,0,1);
    const p=project(e.x,e.y,0);
    ctx.save();ctx.translate(p.x,p.y);ctx.globalAlpha=(1-k)*(e.kind==='step'?.25:.6);
    const n=e.n||(e.kind==='step'?2:6);
    for(let i=0;i<n;i++){
      const an=(i/n)*TAU+e.x*.1,d=(10+50*k)*p.s*(e.kind==='step'?.4:1);
      ctx.fillStyle=e.kind==='debris'?'#5d5140':'#8a7f68';
      const sz=(e.kind==='debris'?3.2:2.6)*(1-k*.6)*p.s;
      ctx.beginPath();ctx.arc(Math.cos(an)*d,Math.sin(an)*d*.5-(e.kind==='debris'?40*k*(1-k)*4:8*k),sz,0,TAU);ctx.fill();
    }
    ctx.restore();
  }else if(e.kind==='teleglow'){
    const k=clamp(t/(e.dur||.7),0,1);
    const p=project(e.x,e.y,60);
    ctx.save();ctx.globalAlpha=.5*k;ctx.fillStyle='#9fc4d8';
    ctx.beginPath();ctx.arc(p.x,p.y,8+6*Math.sin(k*12),0,TAU);ctx.fill();ctx.restore();
  }else if(e.kind==='bolt'){
    const p=project(e.x,e.y,e.z||70);
    ctx.save();ctx.fillStyle='#a8d0e0';ctx.shadowColor='#a8d0e0';ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(p.x,p.y,5,0,TAU);ctx.fill();
    ctx.globalAlpha=.4;ctx.beginPath();ctx.arc(p.x-e.vx*.02,p.y-e.vy*.02,3.4,0,TAU);ctx.fill();
    ctx.restore();
  }else if(e.kind==='levelup'){
    const k=clamp(t/.9,0,1);
    const p=project(player.x,player.y,0);
    ctx.save();ctx.translate(p.x,p.y);ctx.scale(1,Math.cos(cam.pitch*RAD));
    ctx.globalAlpha=1-k;ctx.strokeStyle='#d9b25f';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,(30+80*k)*p.s,0,TAU);ctx.stroke();ctx.restore();
  }
}
function drawStandard(){
  if(!exitStandard)return;
  const s=exitStandard;
  drawShadow(s.x,s.y,16,.35);
  const p=project(s.x,s.y,0);
  const t=performance.now()/1000;
  ctx.save();ctx.translate(p.x,p.y);
  const hh=130*p.s;
  ctx.strokeStyle='#7c5f3a';ctx.lineWidth=3*p.s;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-hh);ctx.stroke();
  const wave=Math.sin(t*3)*8*p.s;
  ctx.fillStyle='#4e9a7a';
  ctx.beginPath();ctx.moveTo(0,-hh);ctx.quadraticCurveTo(34*p.s,-hh+6+wave*.3,58*p.s,-hh+10+wave);
  ctx.lineTo(52*p.s,-hh+30+wave*.6);ctx.quadraticCurveTo(26*p.s,-hh+26,0,-hh+22);ctx.fill();
  ctx.fillStyle='#d9b25f';ctx.beginPath();ctx.arc(0,-hh,4*p.s,0,TAU);ctx.fill();
  ctx.restore();
  const pp=project(s.x,s.y,150);
  ctx.save();ctx.font='11px Georgia';ctx.textAlign='center';ctx.fillStyle='#5aa88a';
  ctx.fillText('depart (E)',pp.x,pp.y);ctx.restore();
}
function drawAmbient(){
  if(!FX_ON)return;
  ctx.save();
  for(const a of ambient){
    const p=project(a.x,a.y,a.z);
    const k=Math.min(a.t,a.ttl-a.t,1);
    ctx.globalAlpha=.25*k;
    ctx.fillStyle=a.kind==='leaf'?'#7c8a54':'#cabf9e';
    ctx.beginPath();ctx.arc(p.x,p.y,a.kind==='leaf'?2:1.2,0,TAU);ctx.fill();
  }
  ctx.restore();
}
function render(){
  ctx.clearRect(0,0,W,H);
  if(state==='boot'||state==='title'||state==='direction'){renderTitleScene();return}
  drawGround();
  // ground-level effects first (telegraphs, rings)
  for(const e of effects)if(e.kind.startsWith('tele')||e.kind==='slam'||e.kind==='deathring')drawEffect(e);
  // depth sort everything standing
  const draws=[];
  for(const s of scenery)draws.push({y:s.y,f:()=>drawSceneryItem(s)});
  for(const a of entities)draws.push({y:a.y,f:()=>drawActor(a)});
  if(player)draws.push({y:player.y,f:()=>drawActor(player)});
  for(const l of groundLoot)draws.push({y:l.y,f:()=>drawLoot(l)});
  if(exitStandard)draws.push({y:exitStandard.y,f:drawStandard});
  for(const e of effects)if(!e.kind.startsWith('tele')&&e.kind!=='slam'&&e.kind!=='deathring')draws.push({y:e.y+1,f:()=>drawEffect(e)});
  draws.sort((a,b)=>a.y-b.y);
  for(const d of draws)d.f();
  drawAmbient();
  // floaters
  ctx.save();ctx.textAlign='center';
  for(const f of floaters){
    const p=project(f.x,f.y,f.z);
    ctx.globalAlpha=1-f.t/.9;ctx.font=(f.big?'bold 17px':'13px')+' Georgia';
    ctx.fillStyle=f.col;ctx.fillText(f.txt,p.x,p.y);
  }
  ctx.restore();
  // tilt-shift: blur top and bottom bands
  if(cam.tilt>0&&FX_ON){
    ctx.save();
    ctx.filter='blur(2.2px)';ctx.globalAlpha=.75*cam.tilt;
    const bh=H*.16;
    ctx.drawImage(cv,0,0,cv.width,bh*devicePixelRatio,0,0,W,bh);
    ctx.drawImage(cv,0,cv.height-bh*devicePixelRatio,cv.width,bh*devicePixelRatio,0,H-bh,W,bh);
    ctx.restore();
  }
}
function renderTitleScene(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0d0f12');g.addColorStop(1,'#1a150f');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const t=performance.now()/1000;
  for(let i=0;i<8;i++){
    const sp=SPRITES.tree;if(!sp)break;
    const x=W*.12+i*W*.11,sc=.35+((i*37)%40)/100;
    ctx.save();ctx.globalAlpha=.14+.05*Math.sin(t+i);
    ctx.drawImage(sp.img,x-sp.w*sc/2,H*.72-sp.h*sc,sp.w*sc,sp.h*sc);ctx.restore();
  }
}

function drawMap(){
  const mc=el('mapcanvas');if(!mc)return;const g=mc.getContext('2d');
  const Wm=mc.width,Hm=mc.height;

    g.save();g.globalAlpha=.16;g.strokeStyle='#5aa88a';g.setLineDash([3,5]);
    const cx=NODES['wardens-circle'].pos[0]*Wm,cy=NODES['wardens-circle'].pos[1]*Hm;
    for(let i=0;i<6;i++){const an=-1.1+i*.42;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(an)*180,cy+Math.sin(an)*180);g.stroke();
      g.beginPath();g.arc(cx+Math.cos(an)*180,cy+Math.sin(an)*180,7,0,TAU);g.stroke()}
    g.restore();
    g.fillStyle='#3d7a63';g.font='11px Georgia';g.fillText('…the wider web of roads, for the seasons to come',Wm-290,Hm-14);
  }
  g.strokeStyle='#3a3128';g.lineWidth=2;
  for(const [k,n] of Object.entries(NODES)){
    for(const nx of n.next||[]){
      const a=n.pos,b=NODES[nx].pos;
      g.save();
      if(house.cleared.includes(k)&&house.unlocked.includes(nx))g.strokeStyle='#6b5a3d';
      g.setLineDash(NODES[nx].optional||n.optional?[4,4]:[]);
      g.beginPath();g.moveTo(a[0]*Wm,a[1]*Hm);g.lineTo(b[0]*Wm,b[1]*Hm);g.stroke();g.restore();
    }
  }
  mapHits=[];
  for(const [k,n] of Object.entries(NODES)){
    const x=n.pos[0]*Wm,y=n.pos[1]*Hm;
    const cleared=house.cleared.includes(k),open=house.unlocked.includes(k);
    g.save();
    g.beginPath();g.arc(x,y,13,0,TAU);
    g.fillStyle=cleared?'#2c4237':open?'#4a3b26':'#221d17';g.fill();
    g.lineWidth=2;g.strokeStyle=cleared?'#5aa88a':open?'#b08d57':'#3a3128';g.stroke();
    if(n.climax){g.beginPath();g.arc(x,y,17,0,TAU);g.setLineDash([2,3]);g.stroke()}
    g.fillStyle=open?'#d8cdb8':'#6b6252';g.font='11px "Segoe UI"';g.textAlign='center';
    g.fillText(n.name,x,y+30);
    if(n.knowledge&&!cleared){g.fillStyle='#5aa88a';g.font='9px "Segoe UI"';g.fillText('◆ knowledge',x,y+42)}
    if(cleared){g.fillStyle='#5aa88a';g.font='10px Georgia';g.fillText('✓',x-.5,y+3.5)}
    g.restore();
    if(open&&!cleared||open&&k!=='hearthstead')mapHits.push({x,y,k});
    else if(open)mapHits.push({x,y,k});
  }
  mc.onclick=ev=>{
    const r=mc.getBoundingClientRect();
    const mx=(ev.clientX-r.left)*(Wm/r.width),my=(ev.clientY-r.top)*(Hm/r.height);
    for(const hnode of mapHits){
      if(Math.hypot(mx-hnode.x,my-hnode.y)<20){
        if(!scion){showDirectionChoice();return}
        enterNode(hnode.k);return;
      }
    }
  };
}
let mapHits=[];
function showNodeSummary(def,banked,first){
  state='map';
  let h='<h1>'+def.name+' — held</h1>';
  h+='<p>The standard stands. Word of it will travel.</p>';
  h+='<h3>Brought home to the House</h3>';
  if(banked.length){h+='<div style="display:flex;flex-wrap:wrap;gap:8px">';for(const it of banked)h+='<div class="item q'+it.q+'" style="width:200px"><div class="nm">'+it.name+'</div><div class="st">'+itemStatText(it)+'</div></div>';h+='</div>'}
  else h+='<p class="dim">Nothing beyond what you wear. The wearing is also a keeping.</p>';
  if(first)h+='<p style="color:var(--verd)">House standing +'+(def.climax?30:(def.optional?14:10))+(def.knowledge?' · '+def.knowledge.label+' learned: '+def.knowledge.text:'')+'</p>';
  h+='<div style="margin-top:18px"><button class="big verd" id="btnmap">To the valley map</button></div>';
  showOverlay(h);el('btnmap').onclick=enterMap;
}
function showDeathScreen(relics,lostCount,killer){
  let h='<h1 style="color:var(--blood)">'+scionDeadName()+' is gone</h1>';
  h+='<p>Cut down at '+NODES[currentNode].name+' by '+killer+'. The pack they carried — '+(lostCount?lostCount+' unbanked find'+(lostCount===1?'':'s')+' — is lost where they fell.':'empty — nothing else was lost.')+'</p>';
  h+='<p style="color:var(--verd)">The House endures. Its standing, stores, knowledge, and every road already held remain.</p>';
  if(relics.length){
    h+='<h3>Entered into the House relic-record</h3><div style="display:flex;gap:8px;flex-wrap:wrap">';
    for(const it of relics)h+='<div class="item q4" style="width:220px"><div class="nm">'+it.name+'</div><div class="st">'+itemStatText(it)+'</div><div class="hist">'+it.history[it.history.length-1]+'</div></div>';
    h+='</div><p class="dim" style="font-size:12px">What the dead carried is not gone — it is owed. Relics return to the field: rediscovered in later expeditions, most often in the hands of elites.</p>';
  }
  h+='<div style="margin-top:18px"><button class="big verd" id="btnsucc">Raise a successor</button></div>';
  showOverlay(h);
  el('btnsucc').onclick=()=>showDirectionChoice();
}
function scionDeadName(){return house.lineage.length?house.lineage[house.lineage.length-1].name:'The Scion'}
function showFounding(){
  state='founded';SFX.found();
  const suggested=['Verdigris','Emberline','Ashmark','Reedholm','Coppervein','Barrowlight'][house.lineage.length%6];
  let h='<div style="text-align:center"><div class="dim" style="letter-spacing:.4em;text-transform:uppercase">the valley will speak of this</div>'
    +'<h1 style="font-size:32px;margin:12px 0">The Warden has fallen</h1>'
    +'<p style="max-width:64ch;margin:10px auto">Elders from three settlements come to the circle. They lay bronze at '+scion.name+'’s feet and ask the name under which your people will be counted, traded with, feared, and remembered.</p>'
    +'<div style="margin:20px 0"><input type="text" id="housename" value="'+suggested+'" maxlength="18"></div>'
    +'<button class="big verd" id="btnfound">Found the House</button></div>';
  showOverlay(h);
  el('btnfound').onclick=()=>{
    const nm=el('housename').value.trim()||suggested;
    house.name=nm;house.founded=true;house.standing+=30;
    house.lineage.push=house.lineage.push; // noop, clarity
    save();renderHUD();
    let h2='<div style="text-align:center"><h1 style="font-size:34px;color:var(--verd)">House '+nm+'</h1>'
      +'<p style="max-width:60ch;margin:12px auto">Founded in the season of the burning fields, by '+scion.name+' the '+DIRECTIONS[scion.dir].label+'. Scions will grow old, fall, and be replaced. The House will not.</p>'
      +'<p class="dim">The campaign is the House’s, completed once. New Scions rise only to walk roads already held — and the web of roads beyond the circle is now open on the valley map.</p>'
      +'<div style="margin-top:20px"><button class="big verd" id="btnmap2">See the valley</button></div></div>';
    showOverlay(h2);el('btnmap2').onclick=()=>{completeClimaxNode()};
  };
}
function completeClimaxNode(){
  const def=NODES[currentNode];
  if(!house.cleared.includes(currentNode)){house.cleared.push(currentNode);house.standing+=0}
  const banked=scion.pack.splice(0);house.stores.push(...banked);
  save();enterMap();
}

/* ============================== debug panel ============================== */
function renderDebug(){
  const bd=el('debugbd');
  bd.innerHTML='';
  const btn=(lb,fn,needsScion)=>{const b=document.createElement('button');b.textContent=lb;
    b.onclick=()=>{if(needsScion!==false&&(!player||!scion||!player.alive)){toast('No living Scion in the field','');return}fn()};
    bd.appendChild(b)};
  btn('give item',()=>{if(player)dropItem(makeItem({level:scion.level}),player.x+60,player.y)});
  btn('give masterwork',()=>{if(player)dropItem(makeItem({level:scion.level+2,q:3,modCount:2}),player.x+60,player.y)});
  btn('cycle weapon',()=>{const ks=Object.keys(WEAPONS);const cur=player.weapon?ks.indexOf(player.weapon.type):-1;const it=makeItem({type:ks[(cur+1)%ks.length],material:'bronze',level:scion.level});scion.pack.push(it);equipItem(it)});
  btn('level up',()=>gainXP(xpNext(scion.level)-scion.xp));
  btn('spawn raider',()=>spawnEnemy('raider',scion.level,player.x+400,player.y));
  btn('spawn spearman',()=>spawnEnemy('spearman',scion.level,player.x+420,player.y+60));
  btn('spawn shade',()=>spawnEnemy('shade',scion.level,player.x-420,player.y));
  btn('spawn elite',()=>spawnEnemy('chieftain',scion.level+2,player.x+460,player.y));
  btn('spawn warden',()=>spawnEnemy('warden',7,player.x+520,player.y));
  btn('kill scion',()=>{if(player)applyDamage(player,99999,entities.find(e=>e.alive)||{name:'the laboratory',x:0,y:0},{})});
  btn('force relic drop',()=>{if(house.relicPool.length&&player){const it=house.relicPool.splice(0,1)[0];it.q=4;it.history.push('Recovered (forced) by '+scion.name);dropItem(it,player.x+60,player.y,true)}else toast('relic pool is empty','')});
  btn('unlock all nodes',()=>{house.unlocked=Object.keys(NODES);save();toast('all roads open','house')},false);
  btn('clear node',()=>{entities.forEach(e=>e.alive&&kill(e,player));});
  btn('heal',()=>{player.life=player.lifeMax;player.breath=player.breathMax});
  btn('reset house',()=>{if(confirm('Erase everything?')){localStorage.removeItem(SAVE_KEY);location.reload()}},false);
  btn('fx: '+(FX_ON?'on':'off'),()=>{FX_ON=!FX_ON;renderDebug()},false);
  // camera lab
  const camdiv=document.createElement('div');camdiv.className='cam';
  camdiv.innerHTML='<div style="color:var(--gold);font-family:Georgia;margin-bottom:4px">Camera lab</div>';
  const slider=(lb,min,max,step,get,set)=>{
    const l=document.createElement('label');l.innerHTML=lb+' <input type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+get()+'"><span>'+get()+'</span>';
    const inp=l.querySelector('input'),sp=l.querySelector('span');
    inp.oninput=()=>{set(+inp.value);sp.textContent=inp.value};
    camdiv.appendChild(l);
  };
  slider('pitch',30,85,1,()=>cam.pitch,v=>cam.pitch=v);
  slider('zoom',.4,1.8,.05,()=>cam.zoom,v=>cam.zoom=v);
  slider('perspective',0,.002,.0001,()=>cam.persp,v=>cam.persp=v);
  slider('player anchor',.35,.7,.01,()=>cam.anchor,v=>cam.anchor=v);
  slider('fog',0,.9,.05,()=>cam.fog,v=>cam.fog=v);
  slider('tilt-shift',0,1,.1,()=>cam.tilt,v=>cam.tilt=v);
  const pr=document.createElement('div');pr.style.marginTop='6px';
  for(const [nm,p] of Object.entries(CAM_PRESETS)){
    const b=document.createElement('button');b.textContent=nm;b.style.marginRight='4px';
    b.onclick=()=>{Object.assign(cam,p);renderDebug()};pr.appendChild(b);
  }
  camdiv.appendChild(pr);bd.appendChild(camdiv);
}

/* ============================== input ============================== */
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  keys[k]=true;
  if(k===' '){e.preventDefault();if(state==='instance')dodge()}
  if(k==='i'&&state==='instance')togglePanel('inv',renderInv);
  if(k==='m'){if(state==='instance'&&nodeCleared)enterMap();else if(state==='map'&&currentNode)hideOverlay(),state='instance';}
  if(k==='`')togglePanel('debug',renderDebug);
  if(k==='e'&&state==='instance')interact();
  if(k==='escape'){closePanels()}
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
cv.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
cv.addEventListener('mousedown',e=>{audio();if(e.button===0)mouse.down=true;if(e.button===2)mouse.rdown=true});
addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false;if(e.button===2)mouse.rdown=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
function interact(){
  const l=nearestLoot();
  if(l){pickupLoot(l);
    if(introTask&&l.first){introTask.done=true;
      toast('Armed. It is a quiet morning — for a while.','');
      crisisTimer=7;
      const it=l.item;scion.pack.includes(it)&&equipItem(it);
    }
    return;
  }
  if(exitStandard&&dist(player.x,player.y,exitStandard.x,exitStandard.y)<120){completeNode();return}
}

/* ============================== main loop ============================== */
let last=performance.now(),acc=0;const STEP=1/60;
function frame(now){
  const dtRaw=Math.min(.1,(now-last)/1000);last=now;
  acc+=dtRaw;
  while(acc>=STEP){acc-=STEP;tick(STEP)}
  render();
  requestAnimationFrame(frame);
}
/* hidden-tab fallback keeps the sim testable and honest */
setInterval(()=>{if(document.hidden){const now=performance.now();const dtRaw=Math.min(.1,(now-last)/1000);last=now;acc+=dtRaw;while(acc>=STEP){acc-=STEP;tick(STEP)}}},50);
function tick(dt){
  if(state!=='instance')return;
  if(hitstop>0){hitstop-=dt;return}
  timeAlive+=dt;
  playerUpdate(dt);
  for(const a of entities){if(a.alive)enemyUpdate(a,dt);else a.deadT+=dt}
  entities=entities.filter(a=>a.alive||a.deadT<2.6);
  for(const a of entities)if(a.hurtT>0)a.hurtT-=dt;
  if(player&&player.hurtT>0)player.hurtT-=dt;
  fxUpdate(dt);
  checkWave();
  // intro crisis
  if(introTask&&introTask.done&&crisisTimer>0){
    crisisTimer-=dt;
    if(crisisTimer<=0){
      introTask=null;SFX.horn();shake(6);
      toast('Smoke on the ridge. The horn. THE HORN.','gold');
      setTimeout(()=>{NODES.hearthstead.waves=[[['raider',1],['raider',1]],[['raider',1],['raider',1],['spearman',2]]];waveIdx=0;spawnWave()},1600);
    }
  }
  // camera follow + shake
  if(player){
    cam.x=lerp(cam.x,player.x,1-Math.pow(.002,dt));
    cam.y=lerp(cam.y,player.y,1-Math.pow(.002,dt));
  }
  if(cam.shakeT>0){cam.shakeT-=dt;const a=cam.shakeA*(cam.shakeT/.28);cam.tx=(Math.random()-.5)*a;cam.ty=(Math.random()-.5)*a}else{cam.tx=0;cam.ty=0;cam.shakeA=0}
  // interaction prompt
  const l=nearestLoot();
  const pr=el('prompt');
  if(l){pr.style.display='block';pr.textContent='E — take '+l.item.name}
  else if(exitStandard&&player&&dist(player.x,player.y,exitStandard.x,exitStandard.y)<120){pr.style.display='block';pr.textContent='E — plant the standard and depart'}
  else pr.style.display='none';
}

/* ============================== boot ============================== */
window.__V={get state(){return state},get house(){return house},get scion(){return scion},get player(){return player},
  get entities(){return entities},enterNode,spawnEnemy,makeItem,tick,cam,NODES,save,
  set state(v){state=v}};
loadAssets().then(()=>{
  load();
  showTitle();
  requestAnimationFrame(frame);
});
</script>

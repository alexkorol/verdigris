<!doctype html><meta charset="utf-8"><title>Raider SW fall candidate</title>
<style>body{background:#201f1d;color:#eee;font:16px system-ui}canvas{image-rendering:pixelated;border:1px solid #605c52;margin:16px}button,input{margin:8px}</style>
<h1>Raider SW fall candidate</h1><button id="play">Pause</button><input id="phase" type="range" min="-1" max="3" value="-1"><span id="status"></span><br><canvas id="native" width="128" height="112"></canvas><canvas id="large" width="384" height="336"></canvas>
<script>
const paths=['idle-reference.png',...Array.from({length:4},(_,i)=>'raider_death'+i+'_sw.png')];
const imgs=paths.map(p=>{let a=new Image();a.src=p;return a});const labels=['idle','recoil','buckle','fall','settled'],duration=[400,100,130,110,1000];let playing=true,start=performance.now(),manual=-1;
function draw(f){for(let id of ['native','large']){let c=document.getElementById(id),x=c.getContext('2d');x.imageSmoothingEnabled=false;x.fillStyle='#201f1d';x.fillRect(0,0,c.width,c.height);if(imgs[f+1].complete)x.drawImage(imgs[f+1],0,0,c.width,c.height)}document.getElementById('status').textContent=(f<0?'IDLE':f+' '+labels[f+1]);document.getElementById('phase').value=f}
function tick(t){let f=manual;if(playing){let a=(t-start)%1740;for(let i=0;i<5;i++){if(a<duration[i]){f=i-1;break}a-=duration[i]}}draw(f);requestAnimationFrame(tick)}
document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'Pause':'Play';start=performance.now()};document.getElementById('phase').oninput=e=>{manual=Number(e.target.value);playing=false;document.getElementById('play').textContent='Play'};requestAnimationFrame(tick)
</script>

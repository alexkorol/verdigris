<!doctype html><meta charset="utf-8"><title>Raider SW candidate review</title><style>body{background:#201f1d;color:#eee;font:16px system-ui}canvas{image-rendering:pixelated;border:1px solid #5d675c;margin:16px}button,input{margin:8px}p{max-width:800px}</style><h1>Raider SW candidate</h1><button id="play">Pause</button><button id="mode">Idle transition: on</button><input id="phase" type="range" min="-1" max="7" value="-1"><span id="status"></span><br><canvas id="native" width="80" height="96"></canvas><canvas id="large" width="320" height="384"></canvas><script>const paths=['idle-reference.png',...Array.from({length:8},(_,i)=>'raider_walk'+i+'_sw.png')];const imgs=paths.map(p=>{let a=new Image();a.src=p;return a});let playing=true,transition=true,start=performance.now(),manual=-1;function draw(f){for(let id of ['native','large']){const c=document.getElementById(id),x=c.getContext('2d');x.imageSmoothingEnabled=false;x.fillStyle='#201f1d';x.fillRect(0,0,c.width,c.height);if(imgs[f+1].complete)x.drawImage(imgs[f+1],0,0,c.width,c.height)}document.getElementById('status').textContent=f<0?'IDLE':'Frame '+f;document.getElementById('phase').value=f}function tick(t){let f=manual;if(playing){let elapsed=t-start;if(transition){let a=elapsed%2080;f=a<400||a>=1680?-1:Math.floor((a-400)/80)%8}else f=Math.floor(elapsed/80)%8}draw(f);requestAnimationFrame(tick)}document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'Pause':'Play';start=performance.now()};document.getElementById('mode').onclick=()=>{transition=!transition;document.getElementById('mode').textContent='Idle transition: '+(transition?'on':'off');start=performance.now()};document.getElementById('phase').oninput=e=>{manual=Number(e.target.value);playing=false;document.getElementById('play').textContent='Play'};requestAnimationFrame(tick)</script>

name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify release candidate
        # PLAYTEST_LOAD_MODE is the suite's documented, bounded (1.75x cap)
        # shared-machine gate (playtest/timing.mjs). Two consecutive master
        # runs failed on DIFFERENT marginal scenarios under runner load
        # (2026-08-20); authored deadlines remain the floor.
        env:
          PLAYTEST_LOAD_MODE: '1'
        run: npm run verify
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: test-results/
          if-no-files-found: ignore

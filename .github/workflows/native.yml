name: Native

on:
  push:
    branches: [master]
    paths:
      - "native/**"
      - "config/legacy-denylist.json"
      - ".github/workflows/native.yml"
  pull_request:
    branches: [master]
    paths:
      - "native/**"
      - "config/legacy-denylist.json"
      - ".github/workflows/native.yml"

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journey:
    name: Native functionality (software renderer)
    runs-on: windows-latest
    timeout-minutes: 14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Native functional gates
        # configure/build, denylist, core/networking/session tests (session
        # tests bind their own loopback server), camera2d, local scenarios.
        # Density bench is opt-in and omitted. Transcripts go to
        # native/build/ci-logs/ and upload on failure.
        # The hosted runner uses Microsoft Basic Render Driver. All functional
        # assertions run; four GPU timings are explicitly deferred. Release
        # packages must separately pass --scenario all on physical hardware.
        run: powershell -NoProfile -File native/tools/ci-native.ps1 -SoftwareRenderer

      - name: Upload native CI transcripts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-ci-logs
          path: native/build/ci-logs/
          if-no-files-found: ignore

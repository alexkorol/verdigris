name: Native

on:
  push:
    paths:
      - "native/**"
      - "config/legacy-denylist.json"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "native/**"
      - "config/legacy-denylist.json"
      - ".github/workflows/native.yml"

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journey:
    runs-on: windows-latest
    timeout-minutes: 14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Native owner-path gates
        # build.ps1 locates MSVC via vswhere. This is the same path the
        # owner runs locally: denylist, core/networking/camera/session
        # tests (session tests start their own loopback server), then
        # local client --scenario all. Density bench is opt-in and omitted.
        run: powershell -NoProfile -File native/tools/ci-native.ps1

      - name: Upload native CI transcripts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-ci-logs
          path: native/build/ci-logs/
          if-no-files-found: ignore
